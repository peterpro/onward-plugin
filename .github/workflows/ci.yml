name: Plugin CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package checks
        run: pnpm check

      - name: Verify generated files are committed
        run: git diff --exit-code -- plugins .agents/plugins .claude-plugin

      - name: Verify whitespace
        run: git diff --check

      - name: Scan generated distribution inputs
        shell: bash
        run: |
          if rg -n -i '(client_secret|service_role_key|access_token|refresh_token|client_credentials|authorization_code)[[:space:]]*[:=]' config plugins .agents .claude-plugin .github; then
            echo "Sensitive configuration pattern detected"
            exit 1
          fi
